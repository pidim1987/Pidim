
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIGIN - Copyright Protected Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glow-btn { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center glow-btn">
                <i class="fa-solid fa-shield-halved text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide gradient-text">ORIGIN</h1>
                <p class="text-[10px] text-sky-400 tracking-wider">COPYRIGHT PROTECTED NETWORK</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-gray-300 hover:text-white">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <div id="user-profile-btn" onclick="openProfileModal()" class="flex items-center space-x-2 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700 cursor-pointer">
                <img id="nav-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=guest" class="w-6 h-6 rounded-full bg-sky-500" alt="Avatar">
                <span id="nav-coins" class="text-xs font-semibold text-sky-400">0 PDP</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto p-4 space-y-4">
        <!-- Feed Section Header -->
        <div class="flex justify-between items-center">
            <h2 class="font-semibold text-sm flex items-center space-x-2 text-gray-300">
                <i class="fa-solid fa-cube text-sky-400"></i>
                <span>ฟีดผลงานต้นฉบับล่าสุด</span>
            </h2>
            <button onclick="loadPosts()" class="text-xs text-sky-400 hover:underline">
                <i class="fa-solid fa-rotate-right"></i> รีเฟรช
            </button>
        </div>

        <!-- Post Container -->
        <div id="posts-container" class="space-y-4">
            <!-- โพสต์จะถูกโหลดมาแสดงตรงนี้ -->
            <div class="text-center py-12 text-gray-500 text-sm">
                <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                <p>ยังไม่มีผลงานต้นฉบับในระบบ</p>
            </div>
        </div>
    </main>

    <!-- Floating Action Menu (ปุ่มลอยกระจายรอบทิศ) -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        <!-- เมนูย่อยที่จะกางออก -->
        <div id="fab-menu" class="hidden flex-col space-y-3 mb-3 items-end transition-all duration-300">
            <button onclick="openPostModal()" class="flex items-center space-x-2 bg-gradient-to-r from-sky-500 to-indigo-600 text-white px-4 py-2.5 rounded-full shadow-lg text-xs font-medium">
                <span>สร้างผลงานใหม่</span>
                <i class="fa-solid fa-pen-nib"></i>
            </button>
            <button onclick="openChatModal()" class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white px-4 py-2.5 rounded-full shadow-lg text-xs font-medium">
                <span>แชทรองรับ</span>
                <i class="fa-solid fa-comments"></i>
            </button>
            <button onclick="openTopupModal()" class="flex items-center space-x-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-4 py-2.5 rounded-full shadow-lg text-xs font-medium">
                <span>กระเป๋าเงิน / เติม PDP</span>
                <i class="fa-solid fa-wallet"></i>
            </button>
        </div>
        <!-- ปุ่มหลัก -->
        <button onclick="toggleFab()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 text-white flex items-center justify-center text-xl shadow-2xl glow-btn transform active:scale-95 transition-transform">
            <i class="fa-solid fa-bolt" id="fab-icon"></i>
        </button>
    </div>

    <!-- Modals & Scripts Placeholder -->
    <script>
        let currentUser = JSON.parse(localStorage.getItem('origin_user')) || {
            id: 1, name: 'ORIGIN Creator', username: 'creator01', creator_id: 'ORG-88902',
            avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=creator', coins: 100,
            email: 'creator@origin.com', phone: '0812345678', bank_account: 'กสิกรไทย 123-4-56789-0'
        };

        function updateNav() {
            document.getElementById('nav-coins').innerText = currentUser.coins + ' PDP';
            document.getElementById('nav-avatar').src = currentUser.avatar;
        }
        updateNav();

        function toggleFab() {
            const menu = document.getElementById('fab-menu');
            const icon = document.getElementById('fab-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            icon.classList.toggle('fa-bolt');
            icon.classList.toggle('fa-xmark');
        }

        function toggleTheme() {
            alert('สลับโหมดธีมสำเร็จ');
        }

        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                const container = document.getElementById('posts-container');
                if(!data.posts || data.posts.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-gray-500 text-sm"><i class="fa-solid fa-folder-open text-3xl mb-2"></i><p>ยังไม่มีผลงานต้นฉบับในระบบ</p></div>`;
                    return;
                }
                container.innerHTML = data.posts.map(post => `
                    <div class="glass p-4 rounded-2xl space-y-3 border border-gray-800">
                        <div class="flex items-center space-x-3">
                            <img src="${post.author_avatar}" class="w-10 h-10 rounded-full bg-gray-700" alt="">
                            <div>
                                <h3 class="font-semibold text-sm text-white">${post.author_name}</h3>
                                <p class="text-[10px] text-sky-400">${post.creator_id} • ${post.hash}</p>
                            </div>
                        </div>
                        <p class="text-sm text-gray-200">${post.content}</p>
                        ${post.media_url ? `<img src="${post.media_url}" class="rounded-xl w-full max-h-60 object-cover" />` : ''}
                        <div class="flex justify-between text-xs text-gray-400 pt-2 border-t border-gray-800">
                            <span><i class="fa-solid fa-heart text-rose-500"></i> ${post.likes_count} ไลค์</span>
                            <span><i class="fa-solid fa-coins text-amber-400"></i> ${post.coins_received} PDP</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }
        loadPosts();

        function openPostModal() { alert('เปิดหน้าสร้างโพสต์'); toggleFab(); }
        function openChatModal() { alert('เปิดระบบแชท'); toggleFab(); }
        function openTopupModal() { alert('เปิดกระเป๋าเงิน / เติมเงิน'); toggleFab(); }
        function openProfileModal() { alert('เปิดโปรไฟล์ผู้ใช้'); }
    </script>
</body>
</html>
